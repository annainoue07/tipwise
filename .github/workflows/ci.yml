name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs when new commits land on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs the exact same command agents run locally. If this passes
      # locally and fails here, the difference is environmental, not a
      # gap between two separate definitions of "verified".
      - name: Verify
        run: pnpm verify
